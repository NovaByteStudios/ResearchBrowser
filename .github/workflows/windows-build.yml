name: Windows-Build erstellen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 erstellen
    runs-on: windows-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Windows-Build erzeugen
        run: npm run make -- --platform=win32 --arch=x64

      - name: Build-Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Research-Browser-0.10.3-Windows-x64
          path: out/make/**
          if-no-files-found: error
          retention-days: 14